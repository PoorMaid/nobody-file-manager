<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Nobody网页文件管理器</title>
<style>
:root{--bg:#0e1626;--card:#1a2740;--card2:#22334f;--line:#33496b;--text:#f2f7ff;--muted:#9db0cc;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--dir:#fbbf24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif}
header{position:sticky;top:0;z-index:60;padding:10px 14px;background:#101a2e;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hleft{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
h1{font-size:16px;margin:0;letter-spacing:.5px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pathbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;overflow:auto;padding:2px 0}
.pathbar a{font-size:13px;color:var(--accent);text-decoration:none;cursor:pointer;padding:2px 4px;border-radius:6px}
.pathbar a:hover{background:var(--card2)}
.pathbar span{color:var(--muted);font-size:12px}
.hact{display:flex;gap:6px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);border-radius:9px;padding:6px 11px;background:var(--card2);color:var(--text);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:#2b3f60}
.btn.primary{background:var(--accent);color:#04222f;border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{background:#3a1420;border-color:#6d2436;color:#ffb4c4}
.btn.danger:hover{background:#4d1a29}
.btn.tiny{padding:3px 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
main{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px;align-items:start}
@media(max-width:980px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card>h2{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1e2c47}
.toolbar{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{background:#0f1a2e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:6px 10px;font:inherit;font-size:13px}
.toolbar input{flex:1;min-width:110px}
.cols{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(60px,72px) minmax(80px,100px);gap:6px;align-items:center;padding:6px 10px 2px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.cols span:first-child{grid-column:2}
.cols span{cursor:pointer;user-select:none;padding:2px 0;border-radius:6px}
.cols span:nth-child(2),.cols span:nth-child(3){text-align:right}
.cols span:hover{background:var(--card2);color:var(--text)}
.cols span.act{background:var(--accent);color:#04222f;font-weight:600}
.list{overflow:auto;flex:1;min-height:340px;max-height:calc(100vh - 250px);overflow-x:auto}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(60px,76px) minmax(76px,100px);gap:6px;align-items:center;padding:9px 10px;border-bottom:1px solid #26364f;cursor:pointer;font-size:13px;min-width:0}
.row:hover{background:var(--card2)}
.row.sel{background:#2b4a6b}
.row .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:#0f1a2e;border:1px solid var(--line);flex-shrink:0}
.row .nm{min-width:0;overflow-wrap:break-word;word-break:break-all;font-size:13px;line-height:1.35}
.row .sz,.row .tm{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.d .nm{color:var(--dir);font-weight:500}
.empty{padding:26px;color:var(--muted);text-align:center}
.loading{padding:26px;color:var(--muted);text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.stat{background:#16223a;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--accent)}
.stat span{font-size:11px;color:var(--muted)}
.tip{font-size:12px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line)}
.gauge{height:7px;border-radius:4px;background:#0f1a2e;overflow:hidden;margin:6px 0}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e)}
.gauge.warn i{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.kv{padding:10px 12px}
.kv .row2{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.kv .row2 b{font-variant-numeric:tabular-nums}
.applist{max-height:520px;overflow:auto}
.app{padding:8px 12px;border-bottom:1px solid #26364f;font-size:12px}
.app .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.app .lb{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .pk{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.app .bar{height:5px;border-radius:3px;background:#0f1a2e;margin-top:5px;overflow:hidden}
.app .bar i{display:block;height:100%;background:var(--accent)}
.app .bar i.hi{background:var(--bad)}
.app .pc{font-variant-numeric:tabular-nums;color:var(--accent);font-size:11px;white-space:nowrap}
.app .sp{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 16px;border-radius:10px;background:#12263f;border:1px solid var(--line);color:#fff;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:200;max-width:88vw}
#toast.show{opacity:1}
#toast.bad{background:#45101c;border-color:#7d2b3c}
#modal{position:fixed;inset:0;background:rgba(4,9,18,.72);display:none;place-items:center;z-index:150;padding:16px}
#modal.on{display:grid}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:460px;width:100%;padding:16px}
.mbox h3{margin:0 0 10px;font-size:14px}
.mbox input,.mbox textarea{width:100%;background:#0f1a2e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;margin-bottom:10px}
.mbox textarea{height:200px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.macts{display:flex;gap:8px;justify-content:flex-end}
.selbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#1c2c46;flex-wrap:wrap;align-items:center;font-size:12px}
#termCard{margin-bottom:14px}
.term-out{background:#080f1c;border-top:1px solid var(--line);padding:10px 12px;height:300px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all;color:#cfe3ff}
.term-out .c{color:#8ab4f8}
.term-out .o{color:#cfe3ff}
.term-out .e{color:#ff8a9b}
.term-out .ok{color:#6ee7a8}
.term-in{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);align-items:center;background:#12203a}
.term-in .ps{color:#6ee7a8;font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
.term-in input{flex:1;background:#0f1a2e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}

#clipbar{display:none;align-items:center;gap:8px;font-size:12px;color:#bfe4ff;background:#12324d;border:1px solid #2a5d86;border-radius:999px;padding:3px 10px}
#clipbar.on{display:flex}
#clipText{max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.mk{outline:2px solid var(--accent);outline-offset:-2px}
#rootSel{background:#0f1a2e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:5px 8px;font:inherit;font-size:12px;max-width:190px}
.badge.ro{color:#ffd08a;border-color:#7a5520;background:#33240c}
.badge.rw{color:#8ef0bd;border-color:#1f6b47;background:#0d2b1d}
#rootPanel{position:fixed;inset:0;background:rgba(4,9,18,.66);display:none;place-items:center;z-index:170;padding:16px}
#rootPanel.on{display:grid}
.rp{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:420px;max-height:82vh;overflow:auto}
.rp h3{margin:0;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line);background:#1e2c47;display:flex;justify-content:space-between;align-items:center}
.rp .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rp .item{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#16223a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.rp .item .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cfe3ff}
.rp .foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.rp .rowline{display:flex;gap:6px}
.rp input{flex:1;background:#0f1a2e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 10px;font:inherit;font-size:12px}
#actMenu{position:fixed;inset:0;background:rgba(4,9,18,.6);display:none;place-items:center;z-index:160;padding:16px}
#actMenu.on{display:grid}
.amm{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:340px;overflow:hidden}
.amm h3{margin:0;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line);background:#1e2c47;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amm button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #26364f;color:var(--text);font:inherit;font-size:13px;padding:11px 14px;cursor:pointer}
.amm button:hover{background:var(--card2)}
.amm button.danger{color:#ffb4c4}
</style>
</head>
<body>
<header>
  <div class="hleft"><h1>📂 Nobody网页文件管理器</h1><span class="badge" id="rootBadge">加载中…</span><select id="rootSel" title="切换储存空间"></select><button class="btn tiny" id="btnAddRoot">＋ 添加储存空间</button></div>
  <div class="pathbar" id="pathBar">/</div>
  <div class="hact">
    <button class="btn primary" id="btnCopy">复制地址</button>
    <button class="btn" id="btnRefresh">刷新</button>
    <button class="btn danger" id="btnStop">停止服务</button>
    <button class="btn" id="btnMulti">多选</button>
    <button class="btn primary" id="btnPaste" style="display:none">📋 粘贴</button>
    <span id="clipbar"><span>📋</span><span id="clipText"></span><button class="btn tiny" id="clipClear">清空</button></span>
  </div>
</header>
<main>
  <section class="card">
    <h2><span>文件浏览</span><span class="badge" id="dirBadge">/</span></h2>
<div class="toolbar">
        <button class="btn ghost" id="btnUp">⬆ 上级</button>
        <button class="btn" id="btnHome">🏠 根目录</button>
        <input id="inpPath" placeholder="路径，回车进入"/>
        <button class="btn" id="btnMkdir">＋新建文件夹</button>
        <button class="btn" id="btnNewfile">＋新建文件</button>
        <button class="btn" id="btnUpload">⬆ 上传</button>
        <button class="btn" id="btnZip">🗜 打包选中</button>
        <input id="inpSearch" placeholder="搜索本层…"/>
      </div>
      <div class="selbar" id="selbar" style="display:none">
        <span id="selInfo">已选 0 项</span>
        <button class="btn tiny" id="selAll">全选</button>
        <button class="btn tiny" id="selNone">取消</button>
        <button class="btn tiny primary" id="selZipDown">全部打包下载</button>
        <button class="btn tiny" id="selCopyAll">全部复制</button>
        <button class="btn tiny danger" id="selDel">删除</button>
      </div>
      <div class="list" id="fileList"><div class="loading">加载中…</div></div>
      <div class="tip" id="roTip" style="display:none;color:#ffd08a">⚠ 当前储存空间为只读：可浏览与下载，不能新建/上传/改名/删除/解压/打包</div>
      <div class="tip">单击目录进入 · 点文本文件编辑 · 点压缩包解压 · 长按/右键更多操作 · 多选后可批量操作</div>
    </section>
    <section class="card" id="termCard">
      <h2><span>💻 终端</span><span class="badge" id="termBadge">就绪</span></h2>
      <div class="term-out" id="termOut"></div>
      <div class="term-in">
        <span class="ps" id="termPs">$</span>
        <input id="termIn" placeholder="输入命令，回车执行" autocomplete="off" spellcheck="false"/>
        <button class="btn" id="termRun">执行</button>
        <button class="btn ghost" id="termClear">清空</button>
      </div>
    </section>
  </main>

<div id="modal"><div class="mbox">
  <h3 id="mTitle">输入</h3>
  <input id="mInput"/>
  <textarea id="mText" style="display:none"></textarea>
  <div class="macts">
    <button class="btn ghost" id="mCancel">取消</button>
    <button class="btn primary" id="mOk">确定</button>
  </div>
</div></div>
<div id="actMenu"><div class="amm"><h3 id="amTitle">-</h3><div id="amBody"></div></div></div>
<div id="rootPanel"><div class="rp">
  <h3><span>储存空间管理</span><span class="badge" id="rpStatus">就绪</span></h3>
  <div class="body">
    <div id="rpList"></div>
    <div class="rowline">
      <input id="rpPath" placeholder="手动输入路径，如 /storage/95F0-2363"/>
      <button class="btn tiny" id="rpAdd">添加</button>
    </div>
    <div class="rowline">
      <button class="btn tiny primary" id="rpScan">扫描可访问的储存空间</button>
    </div>
  </div>
  <div class="foot"><button class="btn ghost" id="rpClose">关闭</button></div>
</div></div>
<div id="toast"></div>
<input type="file" id="filePick" multiple style="display:none"/>

<script>
const $=s=>document.querySelector(s);
const API=location.origin;
let current='', items=[], sortKey='name', sortAsc=true, sel=new Set(), mResolve=null;
let multiMode=false, clipboard=null;const ZIPEXT=['zip','jar','apk'];

function fmt(n){if(n==null||isNaN(n))return'-';let v=Number(n);for(const u of['B','KB','MB','GB','TB']){if(v<1024||u==='TB')return u==='B'?Math.round(v)+' B':v.toFixed(1)+' '+u;v/=1024;}}
function toast(msg,ok){const t=$('#toast');t.textContent=msg;t.className='show'+(ok?'':' bad');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2400);}
function escHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'"',"'":'&#39;'}[c]));}
function iconOf(name,isDir){if(isDir)return'📁';const e=(name.split('.').pop()||'').toLowerCase();
 if(['jpg','jpeg','png','webp','gif','bmp','svg','heic','webp'].includes(e))return'🖼️';
 if(['mp4','mov','mkv','avi','webm','flv','ts'].includes(e))return'🎬';
 if(['mp3','wav','m4a','flac','ogg','aac'].includes(e))return'🎵';
 if(e==='pdf')return'📕';if(e==='apk')return'📦';if(['zip','rar','7z','tar','gz'].includes(e))return'🗜';
 if(['html','htm'].includes(e))return'🌐';if(['js','ts','py','java','sh'].includes(e))return'📜';
 if(['json','yaml','yml','xml'].includes(e))return'📋';if(['txt','md','log'].includes(e))return'📝';
 if(['doc','docx','xls','xlsx','ppt','pptx'].includes(e))return'📄';return'📄';}
let rootPath='', rootWritable=true, rootList=[], serverUid=-1, serverIsRoot=false;
function withRoot(p){
  const sep=p.includes('?')?'&':'?';
  return p+sep+'root='+encodeURIComponent(rootPath||'');
}
async function apiGet(p){const r=await fetch(API+withRoot(p));const d=await r.json().catch(()=>({}));return{ok:r.ok,data:d};}
async function apiPost(p,body){const b=Object.assign({},body||{},{root:rootPath||''});const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));return{ok:r.ok,data:d};}

function modal(title,val,ta){return new Promise(res=>{
 mResolve=res;$('#mTitle').textContent=title;$('#modal').classList.add('on');
 if(ta){$('#mText').style.display='block';$('#mInput').style.display='none';$('#mText').value=val||'';}
 else{$('#mText').style.display='none';$('#mInput').style.display='';$('#mInput').value=val||'';}
 if(!ta)setTimeout(()=>$('#mInput').focus(),30);
});}
$('#mCancel').onclick=()=>{$('#modal').classList.remove('on');mResolve&&mResolve(null);mResolve=null;};
$('#mOk').onclick=()=>{const v=$('#mText').style.display==='block'?$('#mText').value:$('#mInput').value;$('#modal').classList.remove('on');mResolve&&mResolve(v);mResolve=null;};

$('#pathBar').addEventListener('click',e=>{const a=e.target.closest('a[data-c]');if(a)loadDir(a.dataset.c);});
 function sortItems(){
  items.sort((a,b)=>{
   if(a.isDir!==b.isDir)return a.isDir?-1:1;
   let r=0;
   if(sortKey==='size')r=(a.size||0)-(b.size||0);
   else if(sortKey==='mtime')r=(a.mtime||0)-(b.mtime||0);
   else r=a.name.localeCompare(b.name,'zh');
   if(!sortAsc)r=-r;
   return r||a.name.localeCompare(b.name);
  });
 }
function renderList(){
 if(!items.length){$('#fileList').innerHTML='<div class="empty">空目录</div>';return;}
 const q=$('#inpSearch').value.trim().toLowerCase();
 const show=items.filter(i=>!q||i.name.toLowerCase().includes(q));
 $('#fileList').innerHTML=show.map(it=>{
  const d=it.isDir;
  return '<div class="row '+(d?'d':'f')+(sel.has(it.path)?' sel':'')+(multiMode?' mk':'')+'" data-p="'+escHtml(it.path)+'" data-d="'+(d?'1':'0')+'">'
   +'<div class="ic">'+iconOf(it.name,d)+'</div>'
   +'<div class="nm" title="'+escHtml(it.name)+'">'+escHtml(it.name)+'</div>'
   +'<div class="sz">'+(d?'—':fmt(it.size))+'</div>'
   +'<div class="tm">'+(it.mtime?new Date(it.mtime*1000).toLocaleDateString():'')+'</div>'
   +'</div>';
 }).join('');
}
function renderCrumbs(){
 const parts=current?current.split('/'):[];
 let h='<a data-c="">🏠 根目录</a>',acc='';
 parts.forEach(c=>{acc=acc?acc+'/'+c:c;h+='<span>›</span><a data-c="'+escHtml(acc)+'">'+escHtml(c)+'</a>';});
 $('#pathBar').innerHTML=h;
}
function clipLabel(){
 const it=clipboard&&clipboard.items?clipboard.items:[];
 if(!it.length)return '';
 const ns=it.map(p=>p.split('/').pop());
 const head=ns.slice(0,2).join('、');
 return '已复制 '+it.length+' 项：'+head+(it.length>2?'…':'');
}
function renderClip(){
 const has=!!(clipboard&&clipboard.items&&clipboard.items.length);
 $('#clipbar').classList.toggle('on',has);
 $('#btnPaste').style.display=has?'inline-block':'none';
 $('#clipText').textContent=has?clipLabel():'';
}
function updateSelBar(){
 const n=sel.size;
 $('#selbar').style.display=(multiMode&&n)?'flex':'none';
 $('#selInfo').textContent='已选 '+n+' 项';
 renderClip();
}
renderClip();
async function loadDir(rel){
 current=(rel||'').replace(/^\/+|\/+$/g,'');
 const box=$('#fileList');box.innerHTML='<div class="loading">加载中…</div>';
 const{ok,data}=await apiGet('/api/list?rel='+encodeURIComponent(current));
 if(!ok){toast('读取失败：'+(data.error||''),false);box.innerHTML='<div class="empty">读取失败</div>';return;}
  const arr=data.items||[];
  if(!arr.length&&current!==''){toast('目录为空');}
  items=arr;sel=new Set();sortItems();renderCrumbs();renderList();updateSelBar();
  if(typeof data.writable==='boolean'){rootWritable=data.writable;applyWritable();}
  $('#dirBadge').textContent='/'+current;
  $('#inpPath').value='/'+current;
  if(typeof termPsUpdate==='function')termPsUpdate();
 }

async function unzipFile(rel){
 toast('正在解压…');
 const r=await apiPost('/api/op',{act:'unzip',rel});
 if(r.ok){toast('已解压到 '+r.data.result,true);loadDir(current);}
 else toast('解压失败：'+(r.data.error||''),false);
}
function onRowClick(e){
 const row=e.target.closest('.row');if(!row)return;
 const p=row.dataset.p,isDir=row.dataset.d==='1';
 if(multiMode){sel.has(p)?sel.delete(p):sel.add(p);renderList();updateSelBar();return;}
 if(e.shiftKey||e.ctrlKey||e.metaKey){multiMode=true;$('#btnMulti').textContent='退出多选';sel.has(p)?sel.delete(p):sel.add(p);renderList();updateSelBar();return;}
 if(isDir)return loadDir(p);
 if(e.detail>=2)return downloadFile(p);
 const ext=p.split('.').pop().toLowerCase();
 if(ZIPEXT.indexOf(ext)>=0)return unzipFile(p);
 openFile(p);
}
$('#fileList').addEventListener('click',onRowClick);
$('#fileList').addEventListener('contextmenu',e=>{
 const row=e.target.closest('.row');if(!row)return;e.preventDefault();
 menuFor(row.dataset.p,row.dataset.d==='1');
});
$('#fileList').addEventListener('dblclick',e=>{
 const row=e.target.closest('.row');if(!row||row.dataset.d==='1')return;
 downloadFile(row.dataset.p);
});
let pressT=null;
$('#fileList').addEventListener('touchstart',e=>{
 const row=e.target.closest('.row');if(!row)return;
 pressT=setTimeout(()=>{pressT=null;if(navigator.vibrate)navigator.vibrate(20);menuFor(row.dataset.p,row.dataset.d==='1');},500);
},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>$('#fileList').addEventListener(ev,()=>{clearTimeout(pressT);pressT=null;},{passive:true}));

function closeMenu(){$('#actMenu').classList.remove('on');}
function menuFor(p,isDir){
 const name=p.split('/').pop();
 const ext=p.split('.').pop().toLowerCase();
 const zip=!isDir&&ZIPEXT.indexOf(ext)>=0;
 $('#amTitle').textContent=name;
 const body=$('#amBody');body.innerHTML='';
 const add=(txt,fn,danger)=>{
  const b=document.createElement('button');
  b.textContent=txt;
  if(danger)b.className='danger';
  b.onclick=()=>{closeMenu();setTimeout(fn,0);};
  body.appendChild(b);
 };
 if(!isDir){
  add('打开',()=>openFile(p));
  add('下载',()=>downloadFile(p));
  if(zip)add('解压到当前目录',()=>unzipFile(p));
 }
 add('重命名',async()=>{
  const n=await modal('重命名',name);if(!n||n===name)return;
  const r=await apiPost('/api/op',{act:'rename',rel:p,name:n});
  r.ok?(toast('已重命名',true),loadDir(current)):toast('失败：'+r.data.error,false);
 });
 add('复制',()=>{clipboard={type:'copy',items:[p]};renderClip();toast('已复制'+name,true);});
 add('复制路径',async()=>{const t='/'+p;try{await navigator.clipboard.writeText(t);toast('已复制：'+t,true);}catch(e){toast(t,true);}});
 add('删除',()=>doRemove([p]),true);
 $('#actMenu').classList.add('on');
}
$('#actMenu').addEventListener('click',e=>{if(e.target.id==='actMenu')closeMenu();});

function downloadFile(rel){const a=document.createElement('a');a.href=API+'/api/file?rel='+encodeURIComponent(rel)+'&root='+encodeURIComponent(rootPath||'');a.download=rel.split('/').pop();document.body.appendChild(a);a.click();a.remove();toast('开始下载',true);}
async function openFile(rel){
 const name=rel.split('/').pop().toLowerCase();
 const txt=['txt','md','log','json','js','css','html','htm','py','sh','xml','yml','yaml','ini','conf','csv'].some(e=>name.endsWith('.'+e));
 if(!txt){return downloadFile(rel);}
 const{ok,data}=await apiGet('/api/text?rel='+encodeURIComponent(rel));
 if(!ok){toast('无法读取文本：'+(data.error||''),false);return downloadFile(rel);}
 const v=await modal('编辑 '+rel.split('/').pop(),data.text,true);
 if(v===null)return;
 if(v!==data.text){const r=await apiPost('/api/op',{act:'save',rel,text:v});r.ok?toast('已保存',true):toast('保存失败：'+r.data.error,false);}
}

async function doRemove(paths){
 if(!paths.length)return toast('未选择',false);
 if(!confirm('确定删除 '+paths.length+' 项？不可恢复'))return;
 let n=0;
 for(const p of paths){const{ok}=await apiPost('/api/op',{act:'remove',rel:p});if(ok)n++;}
 toast('已删除 '+n+'/'+paths.length+' 项',n>0);sel.clear();loadDir(current);
}
async function toDst(act){
 const paths=[...sel];if(!paths.length)return;
 const d=await modal(act==='copy'?'复制到（相对根目录路径）':'移动到（相对根目录路径）',current);
 if(!d)return;
 let n=0;
 for(const p of paths){const{ok}=await apiPost('/api/op',{act,rel:p,dst:d});if(ok)n++;}
 toast(act==='copy'?'已复制 '+n+' 项':'已移动 '+n+' 项',n>0);
 sel.clear();loadDir(current);
}

$('#btnUp').onclick=()=>{const p=current.split('/').filter(Boolean);p.pop();loadDir(p.join('/'));};
$('#btnHome').onclick=()=>loadDir('');
$('#btnMkdir').onclick=async()=>{const n=await modal('新建文件夹名称','');if(!n)return;const r=await apiPost('/api/op',{act:'mkdir',rel:current,name:n});r.ok?(toast('已创建',true),loadDir(current)):toast('失败：'+r.data.error,false);};
$('#btnNewfile').onclick=async()=>{const n=await modal('新建文件名','');if(!n)return;const r=await apiPost('/api/op',{act:'newfile',rel:current,name:n});r.ok?(toast('已创建',true),loadDir(current)):toast('失败：'+r.data.error,false);};
$('#inpPath').addEventListener('keydown',e=>{if(e.key==='Enter')loadDir(e.target.value.replace(/^\/+/,''));});
$('#inpSearch').addEventListener('input',renderList);
$('#btnUpload').onclick=()=>$('#filePick').click();
$('#filePick').onchange=async e=>{
 const fs=[...e.target.files];if(!fs.length)return;
 const files=[];for(const f of fs){files.push({name:f.name,data:await toB64(f)});}
 const r=await apiPost('/api/upload',{rel:current,files});
 r.ok?(toast('已上传 '+r.data.saved.length+' 个文件',true),loadDir(current)):toast('上传失败：'+r.data.error,false);
 e.target.value='';
};
function toB64(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.readAsDataURL(f);});}
$('#btnZip').onclick=async()=>{
 if(!sel.size)return toast('先选择文件',false);
 const n=await modal('压缩包名','archive.zip');if(!n)return;
 const r=await apiPost('/api/op',{act:'zip',rels:[...sel],dst:current?n:current+'/'+n});
 r.ok?(toast('已打包 '+r.data.result,true),loadDir(current)):toast('失败：'+r.data.error,false);
};
$('#btnRefresh').onclick=()=>loadDir(current);
$('#btnCopy').onclick=async()=>{const t=location.origin;try{await navigator.clipboard.writeText(t);toast('地址已复制：'+t,true);}catch(e){toast('复制地址：'+t,true);}};
$('#btnStop').onclick=async()=>{if(!confirm('停止服务？'))return;try{await fetch(API+'/api/stop_server');}catch(e){}toast('服务已停止');};
$('#selAll').onclick=()=>{items.forEach(i=>sel.add(i.path));renderList();updateSelBar();};
$('#selNone').onclick=()=>{sel.clear();renderList();updateSelBar();};
$('#selDel').onclick=()=>doRemove([...sel]);
$('#btnMulti').onclick=()=>{
 multiMode=!multiMode;
 $('#btnMulti').textContent=multiMode?'退出多选':'多选';
 if(!multiMode)sel.clear();
 renderList();updateSelBar();
};
$('#btnPaste').onclick=async()=>{
 if(!clipboard||!clipboard.items.length)return toast('剪辑板为空',false);
 const r=await apiPost('/api/op',{act:'copy_multi',rels:clipboard.items.slice(),dst:current});
 if(r.ok){toast('已粘贴 '+r.data.done+' 项',true);loadDir(current);}
 else toast('粘贴失败：'+(r.data.error||''),false);
};
$('#selCopyAll').onclick=()=>{
 if(!sel.size)return;
 clipboard={type:'copy',items:[...sel]};
 renderClip();
 toast('已复制 '+clipboard.items.length+' 项',true);
};
$('#selZipDown').onclick=()=>{
 if(!sel.size)return toast('先选择文件',false);
 const rels=[...sel];
 const nm=rels.length===1?rels[0].split('/').pop()+'.zip':'archive.zip';
 const a=document.createElement('a');
 a.href=API+'/api/zipdown?rels='+encodeURIComponent(rels.join(String.fromCharCode(10)))+'&name='+encodeURIComponent(nm)+'&root='+encodeURIComponent(rootPath||'');
 document.body.appendChild(a);a.click();a.remove();
 toast('开始打包下载',true);
};
$('#clipClear').onclick=()=>{clipboard=null;renderClip();toast('已清空剪辑板',true);};

let termCwd='', termHist=[], termHistIdx=-1;
function termPrint(html){const o=$('#termOut');const d=document.createElement('div');d.innerHTML=html;o.appendChild(d);o.scrollTop=o.scrollHeight;}
function termEsc(s){return escHtml(s||'');}
function termPsUpdate(){
  const p=termCwd||current||'';
  $('#termPs').textContent=(p?p.replace(/^\/sdcard/,'~'):'~')+' $';
}
async function termRun(cmd){
  if(!cmd.trim())return;
  const c=cmd.trim();
  if(c==='clear'||c==='cls'){$('#termOut').innerHTML='';return;}
  if(termHist[termHist.length-1]!==c)termHist.push(c);
  termHistIdx=termHist.length;
  termPrint('<span class="c">'+(termEsc(termCwd||current||'')||'~')+' $ '+termEsc(cmd)+'</span>');
  $('#termBadge').textContent='执行中…';
  $('#termRun').disabled=true;
  try{
    const r=await apiPost('/api/exec',{cmd:cmd,cwd:termCwd||current||''});
    if(!r.ok){
      termPrint('<span class="e">请求失败：'+termEsc(r.data.error||'')+'</span>');
    }else{
      const d=r.data;
      if(d.stdout)termPrint('<span class="o">'+termEsc(d.stdout)+'</span>');
      if(d.stderr)termPrint('<span class="e">'+termEsc(d.stderr)+'</span>');
      termPrint('<span class="'+(d.code===0?'ok':'e')+'">[退出码 '+(d.code===0?'0':d.code)+']</span>');
      if(d.cwd)termCwd=d.cwd;
    }
  }catch(e){
    termPrint('<span class="e">错误：'+termEsc(String(e))+'</span>');
  }
  termPsUpdate();
  $('#termBadge').textContent='就绪';
  $('#termRun').disabled=false;
}
function termSubmit(){
  const el=$('#termIn');
  const v=el.value;
  el.value='';
  termRun(v);
}
$('#termRun').onclick=termSubmit;
$('#termIn').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();termSubmit();return;}
  if(e.key==='ArrowUp'){e.preventDefault();if(termHistIdx>0){termHistIdx--;e.target.value=termHist[termHistIdx];}return;}
  if(e.key==='ArrowDown'){e.preventDefault();if(termHistIdx<termHist.length-1){termHistIdx++;e.target.value=termHist[termHistIdx];}else{termHistIdx=termHist.length;e.target.value='';}return;}
  if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();$('#termOut').innerHTML='';return;}
});
$('#termClear').onclick=()=>{$('#termOut').innerHTML='';};
termPrint('<span class="c">Nobody 终端 · 在设备本机(Ubuntu)执行命令</span>');
termPrint('<span class="c">↑/↓ 历史 · Ctrl+L 清屏 · clear 清屏 · 默认跟随当前浏览目录</span>');
termPsUpdate();
(async()=>{
 const{ok,data}=await apiGet('/api/info');
 serverUid = (data&&typeof data.uid==='number')?data.uid:-1;
  serverIsRoot = !!(data&&data.isRoot);
  if(!ok)toast('服务信息读取失败',false);
  else if(!serverIsRoot && data&&data.rootHint && !sessionStorage.getItem('rootHintShown')){
    sessionStorage.setItem('rootHintShown','1');
    toast(data.rootHint,false);
  }
  await loadDir('');
  applyWritable();
})();

function applyWritable(){
  const w=rootWritable;
  const who=serverIsRoot?'root':(serverUid>=0?('uid '+serverUid):'');
  $('#rootBadge').className='badge '+(w?'rw':'ro');
  $('#rootBadge').textContent=(w?'可写':'只读')+(who?(' · '+who):'');
  $('#rootBadge').title=(serverIsRoot?'后端已获得真实 root，可访问全盘路径':'未获得真实 root，仅能访问当前可读目录');
  $('#roTip').style.display=w?'none':'block';
  ['#btnMkdir','#btnNewfile','#btnUpload','#btnZip','#btnPaste','#selDel','#selZip'].forEach(s=>{
    const el=$(s); if(el) el.disabled=!w;
  });
}
function renderRootSel(){
  const s=$('#rootSel');s.innerHTML='';
  rootList.forEach(r=>{
    const o=document.createElement('option');
    o.value=r.path;
    o.textContent=(r.label||r.path)+(r.writable===false?'（只读）':'');
    s.appendChild(o);
  });
  s.value=rootPath;
}
async function loadRoots(pickDefault){
  const{ok,data}=await apiGet('/api/roots');
  if(!ok){toast('读取储存空间失败',false);return;}
  rootList=data.roots||[];
  const def=data.default||'';
  if(pickDefault||!rootPath){
    const match=rootList.find(r=>r.path===rootPath);
    rootPath=match?rootPath:def;
  }
  const cur=rootList.find(r=>r.path===rootPath);
  if(cur&&typeof cur.writable==='boolean')rootWritable=cur.writable;
  renderRootSel();applyWritable();
}
$('#rootSel').onchange=async e=>{
  rootPath=e.target.value;
  const cur=rootList.find(r=>r.path===rootPath)||{};
  rootWritable=cur.writable!==false;
  applyWritable();
  current='';
  await loadDir('');
  toast('已切换到 '+(cur.label||rootPath),true);
};
function rpSet(msg,ok){const el=$('#rpStatus');el.textContent=msg;el.className='badge '+(ok===false?'ro':'rw');}
function rpRender(list){
  const box=$('#rpList');box.innerHTML='';
  if(!list.length){box.innerHTML='<div class="item">暂无储存空间</div>';return;}
  list.forEach(r=>{
    const row=document.createElement('div');row.className='item';
    const info=document.createElement('div');
    info.innerHTML='<b>'+((r.label||r.path))+'</b><br><span style="opacity:.7">'+r.path+'</span>';
    const st=document.createElement('span');st.className='badge '+(r.writable===false?'ro':'rw');
    st.textContent=r.writable===false?'只读':'可写';
    const bd=document.createElement('div');
    bd.appendChild(st);
    if(r.path!==(window.__defRoot||'')&&r.path!==rootPath){
      const rm=document.createElement('button');rm.className='btn tiny ghost';rm.textContent='移除';
      rm.onclick=async()=>{
        const{ok,data}=await apiGet('/api/roots/remove?path='+encodeURIComponent(r.path));
        rpSet(data.message||(ok?'已移除':'失败'),ok);
        if(ok){await loadRoots(false);rpRender(rootList);}
      };
      bd.appendChild(rm);
    }
    row.appendChild(info);row.appendChild(bd);box.appendChild(row);
  });
}
async function openRootPanel(){
  $('#rootPanel').classList.add('on');
  rpSet('加载中…');
  const{ok,data}=await apiGet('/api/roots');
  if(!ok){rpSet('读取失败',false);return;}
  rootList=data.roots||[];window.__defRoot=data.default||'';
  rpRender(rootList);rpSet('就绪');
}
$('#btnAddRoot').onclick=openRootPanel;
$('#rpClose').onclick=()=>$('#rootPanel').classList.remove('on');
$('#rpAdd').onclick=async()=>{
  const p=($('#rpPath').value||'').trim();
  if(!p)return toast('请输入路径',false);
  rpSet('添加中…');
  const{ok,data}=await apiGet('/api/roots/add?path='+encodeURIComponent(p));
  rpSet(data.message||(ok?'已添加':'失败'),ok);
  if(ok){$('#rpPath').value='';await loadRoots(false);rpRender(rootList);}
};
$('#rpScan').onclick=async()=>{
  rpSet('扫描中…');
  const{ok,data}=await apiGet('/api/scan_storage');
  if(!ok){rpSet('扫描失败',false);return;}
  const found=data.found||[];
  if(!found.length){rpSet('未发现可添加的储存空间',false);return;}
  const box=$('#rpList');box.innerHTML='';
  found.forEach(v=>{
    const row=document.createElement('div');row.className='item';
    const info=document.createElement('div');
    info.innerHTML='<b>'+(v.label||v.path)+'</b><br><span style="opacity:.7">'+v.path+'</span>';
    const bd=document.createElement('div');
    const st=document.createElement('span');st.className='badge '+(v.writable===false?'ro':'rw');
    st.textContent=v.writable===false?'只读':'可写';bd.appendChild(st);
    const add=document.createElement('button');add.className='btn tiny primary';add.textContent='添加';
    add.onclick=async()=>{
      const{ok:d2,data:d}=await apiGet('/api/roots/add?path='+encodeURIComponent(v.path));
      rpSet(d.message||(d2?'已添加':'失败'),d2);
      if(d2){await loadRoots(false);rpRender(rootList);}
    };
    bd.appendChild(add);
    row.appendChild(info);row.appendChild(bd);box.appendChild(row);
  });
  rpSet('发现 '+found.length+' 个，点击添加');
};
(async()=>{await loadRoots(true);applyWritable();})();


</script>
